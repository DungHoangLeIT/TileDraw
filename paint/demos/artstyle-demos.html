<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
:root { --page: #f3f1ec; --ink: #1d1b22; --sub: #5d5a66; --card: #ffffff; --rule: #dedad0; --accent: #6a3df0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #15141a; --ink: #f1eff6; --sub: #a9a5b6; --card: #1f1d27; --rule: #33303f; --accent: #b79bff; color-scheme: dark; } }
:root[data-theme="dark"] { --page: #15141a; --ink: #f1eff6; --sub: #a9a5b6; --card: #1f1d27; --rule: #33303f; --accent: #b79bff; color-scheme: dark; }
body { background: var(--page); color: var(--ink); font-family: "Nunito", "Segoe UI", system-ui, sans-serif; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { max-width: 1320px; margin: 0 auto 22px; }
h1 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 34px); font-weight: 900; text-wrap: balance; }
header p { margin: 0; max-width: 70ch; color: var(--sub); font-size: 15px; line-height: 1.5; font-weight: 600; }
#grid { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 26px 20px; justify-items: center; }
figure { margin: 0; width: 300px; max-width: 100%; }
figcaption { margin-top: 12px; }
figcaption b { display: block; font-size: 17px; font-weight: 900; }
figcaption b span { color: var(--accent); margin-right: 6px; font-variant-numeric: tabular-nums; }
figcaption small { display: block; margin-top: 3px; color: var(--sub); font-size: 13px; line-height: 1.45; font-weight: 600; }

/* ---------- Khung gameplay chung (style 1: Jelly Pop) ---------- */
.ph { width: 300px; max-width: 100%; padding: 12px 12px 16px; border-radius: 30px; position: relative; overflow: hidden;
  background: linear-gradient(180deg, #58c4ff, #6f7bff 55%, #8a5cf0); color: #2a2f7a; font-weight: 800; }
.hud { display: flex; gap: 6px; position: relative; }
.pill { flex: 1; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 14px; font-weight: 900;
  background: linear-gradient(#fff, #e6ecff); box-shadow: 0 3px 0 #3b4bb8, 0 6px 8px rgba(20, 20, 90, .3); }
.pill small { font-size: 9.5px; opacity: .62; letter-spacing: .04em; }
.rb { flex: 0 0 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: linear-gradient(#ffd75a, #ff9f1c); box-shadow: 0 3px 0 #c96a00; }
.rb svg { width: 18px; height: 18px; }
.pic { margin-top: 12px; height: 128px; border-radius: 18px; padding: 6px; position: relative; background: #fffdf6; color: #2b2622;
  box-shadow: 0 5px 0 #c9d0ff, 0 10px 12px rgba(20, 20, 90, .3); }
.pic svg { width: 100%; height: 100%; display: block; border-radius: 13px; }
.bd { margin-top: 14px; height: 302px; border-radius: 24px; position: relative; background: linear-gradient(#fff1d2, #ffdca3);
  box-shadow: 0 6px 0 #d6933f, 0 12px 14px rgba(20, 20, 90, .35), inset 0 4px 0 rgba(255, 255, 255, .8); }
.t { position: absolute; width: 50px; height: 58px; border-radius: 14px; border: 3px solid var(--c); background: linear-gradient(#fff, #eef1f9);
  --d: color-mix(in srgb, var(--c) 66%, #000); --l: color-mix(in srgb, var(--c) 50%, #fff);
  box-shadow: 0 4px 0 var(--d), 0 7px 7px rgba(40, 30, 90, .3); }
.t i { position: absolute; left: 50%; top: 58%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 28%;
  background: radial-gradient(circle at 38% 28%, var(--l), var(--c) 62%, var(--d)); box-shadow: 0 3px 0 var(--d); }
.t i::before { content: ""; position: absolute; left: 16%; top: 13%; width: 46%; height: 17%; border-radius: 50%; background: rgba(255, 255, 255, .85); transform: rotate(-16deg); }
.t.b1 { filter: brightness(.94); }
.t.b2 { filter: brightness(.68) saturate(.8); }
.pg { position: absolute; width: 8px; margin-left: -4px; border-radius: 4px; background: linear-gradient(90deg, #fff3b0, #ffc531 45%, #d98a00); }
.pg.k::before { content: ""; position: absolute; left: -3px; top: -7px; width: 14px; height: 14px; border-radius: 50%; background: inherit; filter: brightness(1.08); }
.tr { margin-top: 16px; height: 64px; border-radius: 18px; display: flex; gap: 4px; padding: 7px; position: relative;
  background: linear-gradient(#2b2a6e, #1b1a4d); box-shadow: 0 5px 0 #121138; }
.sl { flex: 1; border-radius: 10px; background: rgba(255, 255, 255, .08); box-shadow: inset 0 3px 5px rgba(0, 0, 0, .45); }
.tr .t { width: 33px; height: 40px; top: 12px; border-radius: 10px; border-width: 2.5px; }
.tr .t i { width: 18px; height: 18px; margin: -9px 0 0 -9px; }
.bs { display: flex; gap: 8px; margin-top: 14px; }
.bo { flex: 1; height: 44px; border-radius: 15px; display: grid; place-items: center; color: #fff; position: relative;
  background: linear-gradient(var(--a), var(--b)); box-shadow: 0 4px 0 var(--s); }
.bo svg { width: 22px; height: 22px; }
.bo b { position: absolute; right: -3px; top: -6px; min-width: 19px; height: 19px; border-radius: 10px; display: grid; place-items: center; font-size: 11px; background: #fff; color: #2a2f7a; }
.bo:nth-child(1) { --a: #7be07a; --b: #22b455; --s: #11813a; }
.bo:nth-child(2) { --a: #ffc35c; --b: #ff8a1f; --s: #c95f00; }
.bo:nth-child(3) { --a: #d59bff; --b: #9a4dff; --s: #6a27c4; }

/* ---------- 2. Cozy Pastel ---------- */
.s2 { background: #f7ecdf; color: #6b5546; }
.s2 .pill { background: #fffaf3; box-shadow: none; border: 2px solid #ead9c5; }
.s2 .rb { background: #f2b3a0; box-shadow: none; }
.s2 .pic { background: #fffaf3; box-shadow: none; border: 2px solid #ead9c5; color: #8a7160; }
.s2 .bd { background: #efe0cf; box-shadow: inset 0 0 0 2px #e4d2bd; }
.s2 .t { background: #fffaf3; border: 2px solid color-mix(in srgb, var(--c) 45%, #fff); border-radius: 17px; box-shadow: 0 3px 0 color-mix(in srgb, var(--c) 28%, #e4d2bd); }
.s2 .t i { border-radius: 50%; background: color-mix(in srgb, var(--c) 58%, #fff8ef); box-shadow: none; }
.s2 .t i::before { display: none; }
.s2 .t.b2 { filter: brightness(.87); }
.s2 .pg { background: #c9a98a; }
.s2 .tr { background: #e7d3bd; box-shadow: none; }
.s2 .sl { background: #f4e6d6; box-shadow: none; }
.s2 .bo { background: #fffaf3; border: 2px solid #ead9c5; box-shadow: none; color: var(--b); }
.s2 .bo:nth-child(1) { --b: #6fae8d; } .s2 .bo:nth-child(2) { --b: #dd9a52; } .s2 .bo:nth-child(3) { --b: #a088cf; }
.s2 .bo b { background: #6b5546; color: #fff; }

/* ---------- 3. Soft Clay ---------- */
.s3 { background: #e9e4f5; color: #4b4470; --clay: inset 3px 3px 6px rgba(255, 255, 255, .75), inset -4px -5px 8px rgba(70, 55, 130, .16), 0 7px 12px rgba(90, 80, 140, .22); }
.s3 .pill { background: #f6f3fd; box-shadow: var(--clay); }
.s3 .rb { background: #ffb86b; box-shadow: var(--clay); }
.s3 .pic { background: #fbf9ff; box-shadow: var(--clay); }
.s3 .bd { background: #d9d2ee; box-shadow: inset 4px 4px 10px rgba(120, 105, 170, .38), inset -4px -4px 10px rgba(255, 255, 255, .8); }
.s3 .t { border: 0; border-radius: 18px; background: color-mix(in srgb, var(--c) 36%, #fff); box-shadow: var(--clay); }
.s3 .t i { border-radius: 50%; background: var(--c); box-shadow: inset 2px 2px 4px rgba(255, 255, 255, .5), inset -3px -3px 5px rgba(0, 0, 0, .2); }
.s3 .t i::before { display: none; }
.s3 .pg { background: #b3a2e2; }
.s3 .tr { background: #cfc6ea; box-shadow: inset 4px 4px 9px rgba(110, 95, 165, .4), inset -3px -3px 8px rgba(255, 255, 255, .7); }
.s3 .sl { background: rgba(255, 255, 255, .35); box-shadow: none; }
.s3 .bo { background: var(--a); box-shadow: var(--clay); }
.s3 .bo:nth-child(1) { --a: #86d6a4; } .s3 .bo:nth-child(2) { --a: #ffb86b; } .s3 .bo:nth-child(3) { --a: #b99cf2; }

/* ---------- 4. Flat Minimal ---------- */
.s4 { background: #f4f6fb; color: #111827; }
.s4 .pill { background: #fff; box-shadow: none; border-radius: 10px; }
.s4 .rb { background: #111827; box-shadow: none; border-radius: 10px; }
.s4 .pic { background: #fff; box-shadow: none; border-radius: 14px; color: #111827; }
.s4 .bd { background: #fff; box-shadow: none; border-radius: 18px; }
.s4 .t { border: 0; border-radius: 12px; background: var(--c); box-shadow: none; }
.s4 .t i { border-radius: 50%; background: #fff; box-shadow: none; width: 20px; height: 20px; margin: -10px 0 0 -10px; }
.s4 .t i::before { display: none; }
.s4 .t.b1 { filter: brightness(.88); }
.s4 .pg { background: #111827; }
.s4 .tr { background: #111827; box-shadow: none; border-radius: 14px; }
.s4 .sl { background: #1f2937; box-shadow: none; border-radius: 8px; }
.s4 .tr .t i { width: 13px; height: 13px; margin: -6px 0 0 -6px; }
.s4 .bo { background: var(--b); box-shadow: none; border-radius: 12px; }
.s4 .bo:nth-child(1) { --b: #10b981; } .s4 .bo:nth-child(2) { --b: #f59e0b; } .s4 .bo:nth-child(3) { --b: #6366f1; }
.s4 .bo b { background: #111827; color: #fff; }

/* ---------- 5. Neon Night ---------- */
.s5 { background: radial-gradient(circle at 50% 30%, #241c5c, #0a0920 75%); color: #e8e6ff; }
.s5 .pill { background: rgba(255, 255, 255, .06); border: 1.5px solid #7c5cff; box-shadow: 0 0 10px rgba(124, 92, 255, .65); }
.s5 .rb { background: rgba(255, 79, 216, .12); border: 1.5px solid #ff4fd8; box-shadow: 0 0 10px rgba(255, 79, 216, .7); color: #ff9be9; }
.s5 .pic { background: #120f2e; border: 1.5px solid #38e8ff; box-shadow: 0 0 12px rgba(56, 232, 255, .55); color: #a8e9ff; }
.s5 .pic svg .bgf { fill: #120f2e; }
.s5 .bd { background: #110e2b; border: 1.5px solid #3b2f8f; box-shadow: inset 0 0 24px rgba(124, 92, 255, .28); }
.s5 .t { background: #17133a; border: 2px solid var(--c); box-shadow: 0 0 9px var(--c), inset 0 0 8px color-mix(in srgb, var(--c) 35%, transparent); }
.s5 .t i { border-radius: 50%; background: var(--c); box-shadow: 0 0 12px var(--c); }
.s5 .t i::before { display: none; }
.s5 .t.b2 { filter: brightness(.5); }
.s5 .pg { background: #7c5cff; box-shadow: 0 0 6px #7c5cff; }
.s5 .tr { background: #0d0b24; border: 1.5px solid #ff4fd8; box-shadow: 0 0 12px rgba(255, 79, 216, .55); }
.s5 .sl { background: rgba(255, 255, 255, .05); box-shadow: none; }
.s5 .bo { background: color-mix(in srgb, var(--b) 12%, transparent); border: 1.5px solid var(--b); color: var(--b); box-shadow: 0 0 10px color-mix(in srgb, var(--b) 70%, transparent); }
.s5 .bo:nth-child(1) { --b: #3dffa2; } .s5 .bo:nth-child(2) { --b: #ffd23f; } .s5 .bo:nth-child(3) { --b: #38e8ff; }
.s5 .bo b { background: #e8e6ff; color: #0a0920; }

/* ---------- 6. Paper Craft ---------- */
.s6 { background: repeating-linear-gradient(45deg, rgba(74, 59, 42, .05) 0 2px, transparent 2px 7px), #d8bf99; color: #4a3b2a; --cut: 2px 3px 0 rgba(74, 59, 42, .32); }
.s6 .pill { background: #fff8ea; border-radius: 5px; box-shadow: var(--cut); }
.s6 .pill:nth-child(odd) { transform: rotate(-1.5deg); } .s6 .pill:nth-child(even) { transform: rotate(1.2deg); }
.s6 .rb { background: #e2574c; border-radius: 7px; box-shadow: var(--cut); }
.s6 .pic { background: #fffdf5; border-radius: 4px; box-shadow: 3px 4px 0 rgba(74, 59, 42, .3); transform: rotate(-.8deg); }
.s6 .pic::before { content: ""; position: absolute; left: 50%; top: -7px; width: 64px; height: 16px; margin-left: -32px; background: rgba(255, 221, 120, .8); transform: rotate(-3deg); }
.s6 .pic svg { border-radius: 2px; }
.s6 .bd { background: #f3e6cf; border-radius: 7px; box-shadow: 3px 5px 0 rgba(74, 59, 42, .3); }
.s6 .t { border: 0; border-radius: 5px; background: var(--c); box-shadow: var(--cut); }
.s6 .t:nth-child(3n) { rotate: -3deg; } .s6 .t:nth-child(3n+1) { rotate: 2.5deg; }
.s6 .t i { border-radius: 50%; background: #fffdf5; box-shadow: 1px 2px 0 rgba(74, 59, 42, .28); }
.s6 .t i::before { display: none; }
.s6 .pg { background: #7c5c3b; }
.s6 .tr { background: #7a5a3a; border-radius: 7px; box-shadow: var(--cut); }
.s6 .sl { background: rgba(0, 0, 0, .2); box-shadow: none; border-radius: 4px; }
.s6 .bo { background: var(--b); border-radius: 6px; box-shadow: var(--cut); }
.s6 .bo:nth-child(1) { --b: #5fa56b; rotate: -1.5deg; } .s6 .bo:nth-child(2) { --b: #e59a3a; } .s6 .bo:nth-child(3) { --b: #5b86c9; rotate: 1.5deg; }

/* ---------- 7. Candy Gloss ---------- */
.s7 { background: repeating-linear-gradient(135deg, rgba(255, 255, 255, .14) 0 16px, transparent 16px 32px), linear-gradient(#ffb3d1, #ff7eb6 60%, #ff5c9d); color: #c2296d; }
.s7 .pill { box-shadow: 0 3px 0 #d63a7e, 0 6px 8px rgba(160, 20, 80, .3); background: linear-gradient(#fff, #ffe6f0); }
.s7 .rb { background: linear-gradient(#8ee9ff, #2bb8f0); box-shadow: 0 3px 0 #1487b8; }
.s7 .pic { box-shadow: 0 5px 0 #ffd0e3, 0 10px 12px rgba(160, 20, 80, .3); }
.s7 .bd { background: repeating-linear-gradient(135deg, #fff 0 14px, #ffe3ef 14px 28px); box-shadow: 0 6px 0 #e0548f, 0 12px 14px rgba(160, 20, 80, .3); }
.s7 .t { border-radius: 20px; background: linear-gradient(#fff, #fff0f6); box-shadow: 0 4px 0 var(--d), 0 7px 7px rgba(160, 20, 80, .28); }
.s7 .t i { border-radius: 50%; background: repeating-conic-gradient(from 20deg, var(--c) 0 30deg, var(--l) 30deg 60deg); box-shadow: 0 3px 0 var(--d), inset 0 0 0 3px rgba(255, 255, 255, .35); }
.s7 .t i::before { left: 14%; top: 12%; width: 34%; height: 22%; }
.s7 .pg { background: linear-gradient(90deg, #fff, #ffd0e3 50%, #ff8fbd); }
.s7 .tr { background: linear-gradient(#8a4636, #5a2618); box-shadow: 0 5px 0 #3d170d; }
.s7 .bo:nth-child(1) { --a: #9ff0d0; --b: #36c99a; --s: #1f9470; }
.s7 .bo:nth-child(2) { --a: #fff08a; --b: #ffc928; --s: #d99600; }
.s7 .bo:nth-child(3) { --a: #9fdcff; --b: #3aa9f2; --s: #1c7cc0; }
.s7 .bo b { color: #c2296d; }

/* ---------- 8. Wooden Toy ---------- */
.s8 { background: repeating-linear-gradient(90deg, #c58f55 0 46px, #b47d44 46px 48px); color: #4a2e14; }
.s8 .pill { background: #f3d9a8; border: 2px solid #8a5a2b; box-shadow: 0 3px 0 #8a5a2b; border-radius: 10px; }
.s8 .rb { background: #d9534f; border: 2px solid #7d2320; box-shadow: 0 3px 0 #7d2320; }
.s8 .pic { border: 5px solid #8a5a2b; border-radius: 10px; padding: 0; box-shadow: 0 5px 0 #5f3b18; overflow: hidden; }
.s8 .pic svg { border-radius: 0; }
.s8 .bd { background: repeating-linear-gradient(0deg, rgba(138, 90, 43, .13) 0 2px, transparent 2px 10px), #e9c88f; border: 4px solid #8a5a2b; border-radius: 14px; box-shadow: 0 5px 0 #5f3b18; }
.s8 .t { border: 0; border-radius: 8px; background: var(--c); box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .2), inset 0 2px 0 rgba(255, 255, 255, .38), 0 3px 4px rgba(0, 0, 0, .3); }
.s8 .t i { border-radius: 50%; background: #f3d9a8; box-shadow: inset 0 2px 3px rgba(0, 0, 0, .35); }
.s8 .t i::before { display: none; }
.s8 .pg { background: linear-gradient(90deg, #b47d44, #8a5a2b); }
.s8 .tr { background: #8a5a2b; box-shadow: 0 5px 0 #5f3b18; border-radius: 12px; }
.s8 .sl { background: #6f4520; box-shadow: inset 0 3px 4px rgba(0, 0, 0, .4); }
.s8 .bo { background: var(--b); box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .2), inset 0 2px 0 rgba(255, 255, 255, .35), 0 3px 4px rgba(0, 0, 0, .3); border-radius: 10px; }
.s8 .bo:nth-child(1) { --b: #5aa866; } .s8 .bo:nth-child(2) { --b: #e8a030; } .s8 .bo:nth-child(3) { --b: #4f86c6; }
.s8 .bo b { background: #f3d9a8; color: #4a2e14; }

/* ---------- 9. Frosted Glass ---------- */
.s9 { background: linear-gradient(135deg, #ff9a8b, #a18cd1 48%, #5ee7df); color: #2b2350; --glass: 0 8px 20px rgba(60, 40, 120, .2); }
.s9::before { content: ""; position: absolute; left: -40px; top: 150px; width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 255, .55), transparent); }
.s9 .pill, .s9 .rb, .s9 .bd, .s9 .tr { background: rgba(255, 255, 255, .26); border: 1px solid rgba(255, 255, 255, .65); box-shadow: var(--glass); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.s9 .rb { color: #2b2350; }
.s9 .pic { background: rgba(255, 255, 255, .8); border: 1px solid #fff; box-shadow: var(--glass); }
.s9 .t { background: rgba(255, 255, 255, .6); border: 1.5px solid rgba(255, 255, 255, .95); box-shadow: 0 5px 12px rgba(60, 40, 120, .22); border-radius: 16px; }
.s9 .t i { border-radius: 50%; background: linear-gradient(135deg, var(--l), var(--c)); box-shadow: 0 3px 8px color-mix(in srgb, var(--c) 55%, transparent); }
.s9 .t i::before { display: none; }
.s9 .t.b2 { filter: brightness(.8) saturate(.8); }
.s9 .pg { background: rgba(255, 255, 255, .9); }
.s9 .tr { background: rgba(40, 25, 90, .32); }
.s9 .sl { background: rgba(255, 255, 255, .16); box-shadow: none; }
.s9 .bo { background: color-mix(in srgb, var(--b) 60%, transparent); border: 1px solid rgba(255, 255, 255, .7); box-shadow: var(--glass); }
.s9 .bo:nth-child(1) { --b: #2fc98a; } .s9 .bo:nth-child(2) { --b: #ff9a3d; } .s9 .bo:nth-child(3) { --b: #7a5cf0; }

/* ---------- 10. Bold Cartoon ---------- */
.s10 { background: radial-gradient(rgba(0, 0, 0, .1) 1.6px, transparent 2px) 0 0 / 10px 10px, #ffd43b; color: #111; --hard: 3px 3px 0 #111; }
.s10 .pill { background: #fff; border: 3px solid #111; border-radius: 10px; box-shadow: var(--hard); }
.s10 .rb { background: #ff5d5d; border: 3px solid #111; box-shadow: var(--hard); }

.s10 .bd { background: #fff; border: 3px solid #111; border-radius: 16px; box-shadow: 4px 4px 0 #111; }
.s10 .t { background: #fff; border: 3px solid #111; border-radius: 10px; box-shadow: var(--hard); }
.s10 .t i { border-radius: 50%; background: var(--c); border: 2.5px solid #111; box-shadow: none; }
.s10 .t i::before { display: none; }
.s10 .t.b1 { filter: none; background: #e9e9e9; } .s10 .t.b2 { filter: none; background: #bdbdbd; }
.s10 .pg { background: #111; }
.s10 .tr { background: #111; border-radius: 12px; box-shadow: none; }
.s10 .sl { background: #333; box-shadow: none; }
.s10 .tr .t { box-shadow: none; border-color: #fff; }
.s10 .bo { background: var(--b); border: 3px solid #111; border-radius: 10px; box-shadow: var(--hard); color: #111; }
.s10 .bo:nth-child(1) { --b: #4ade80; } .s10 .bo:nth-child(2) { --b: #fb923c; } .s10 .bo:nth-child(3) { --b: #60a5fa; }
.s10 .bo b { border: 2px solid #111; color: #111; }
</style>

<header>
  <h1>Tô Tranh: 10 hướng artstyle</h1>
  <p>Cùng một màn chơi (tranh, board 4x4 móc thẳng đứng, khay 7 ô, ba nút trợ giúp) dựng lại theo mười phong cách hình ảnh khác nhau. Đây là ảnh minh họa dựng bằng mã, chưa áp vào game.</p>

<script>
